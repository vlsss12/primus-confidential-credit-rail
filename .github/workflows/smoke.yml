name: Smoke test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/smoke-test.mjs
      - uses: dtolnay/rust-toolchain@stable
      - name: Run shared Credit Gate conformance vectors
        run: cargo test --locked --manifest-path dvc/credit-gate/Cargo.toml
